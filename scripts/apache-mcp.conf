# Apache VirtualHost configuration for OET MCP Server
# File: /etc/apache2/sites-available/mcp.freely-given.org.conf

<VirtualHost *:80>
    ServerName mcp.freely-given.org
    ServerAdmin webmaster@freely-given.org

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    # Disable buffering for Server-Sent Events (SSE) streaming
    SetEnv proxy-nokeepalive 1
    SetEnv no-gzip 1

    ProxyPass / http://127.0.0.1:8000/ flushpackets=on disablereuse=on
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/oet-mcp-error.log
    CustomLog ${APACHE_LOG_DIR}/oet-mcp-access.log combined
</VirtualHost>
