# Nginx reverse proxy configuration for OET MCP Server
# Place in /etc/nginx/sites-available/mcp.freely-given.org and symlink to sites-enabled

server {
    server_name mcp.freely-given.org; # or your desired domain

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical SSE (Server-Sent Events) streaming settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }
}
